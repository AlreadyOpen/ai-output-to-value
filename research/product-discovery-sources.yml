# Research notes for product ideation, user needs, discovery, and multidisciplinary service design.
#
# These sources support the research draft at content/product-ideas-vs-product-discovery.md.
# They are not yet part of the canonical publication source/claim registry.

sources:
  - id: govuk-learning-user-needs
    title: Learning about users and their needs
    publisher: GOV.UK Service Manual
    url: https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs
    evidence_type: official_guidance
    supports:
      - start_by_learning_about_users_and_their_needs
      - non_user_suggestions_should_be_treated_as_assumptions_to_test
      - discovery_should_examine_current_behaviour_problems_and_needs
    scope: UK Government service-design guidance on user research, user needs, discovery, and validation.
    limitations: Public-service guidance rather than empirical proof of commercial product success. It does not prescribe one universal private-sector product-development method.
    reviewed: 2026-09-14

  - id: govuk-service-standard-understand-users
    title: Understand users and their needs
    publisher: GOV.UK Service Standard
    url: https://www.gov.uk/service-manual/service-standard/point-1-understand-user-needs
    evidence_type: official_guidance
    supports:
      - focus_on_user_problem_not_preselected_solution
      - test_assumptions_early_and_often
      - prototypes_can_test_hypotheses
    scope: Service Standard guidance on understanding users, context, and problems before committing to solutions.
    limitations: Government service standard; not a controlled study and not a commercial-product profitability framework.
    reviewed: 2026-09-14

  - id: govuk-solve-whole-problem
    title: Solve a whole problem for users
    publisher: GOV.UK Service Standard
    url: https://www.gov.uk/service-manual/service-standard/point-2-solve-a-whole-problem
    evidence_type: official_guidance
    supports:
      - design_services_around_user_needs_not_technologies_or_preselected_solutions
      - generative_ai_should_not_be_the_starting_point_by_itself
    scope: Service Standard guidance on solving a user's whole problem and avoiding technology-led fragmentation.
    limitations: UK public-service context. The guidance supports problem-led design, not a claim that technology-push innovation can never succeed.
    reviewed: 2026-09-14

  - id: govuk-service-team-roles
    title: What each role does in a service team
    publisher: GOV.UK Service Manual
    url: https://www.gov.uk/service-manual/the-team/what-each-role-does-in-service-team
    evidence_type: official_guidance
    supports:
      - multidisciplinary_teams_combine_product_research_design_delivery_and_development
      - developers_should_work_with_other_roles_around_user_needs
    scope: UK Government guidance on multidisciplinary digital service teams and role collaboration.
    limitations: Role names and staffing patterns are government-specific and should not be copied mechanically into every organisation.
    reviewed: 2026-09-14

  - id: govuk-set-up-service-team
    title: Set up a service team at each phase
    publisher: GOV.UK Service Manual
    url: https://www.gov.uk/service-manual/the-team/set-up-a-service-team
    evidence_type: official_guidance
    supports:
      - discovery_requires_user_need_research_and_awareness_of_existing_services
      - teams_need_skills_across_research_build_test_security_operations_and_measurement
      - product_delivery_requires_more_than_implementation_skill
    scope: Guidance on skills needed across discovery, alpha, beta, and live service phases.
    limitations: Public-sector delivery guidance; exact team composition depends on context and scale.
    reviewed: 2026-09-14

  - id: govuk-choosing-technology
    title: Choosing technology — an introduction
    publisher: GOV.UK Service Manual
    url: https://www.gov.uk/service-manual/technology/choosing-technology-an-introduction
    evidence_type: official_guidance
    supports:
      - prototypes_can_test_user_need_and_technology_assumptions
      - technical_choices_should_be_revisited_as_understanding_improves
      - technology_selection_follows_understanding_of_landscape_and_needs
    scope: Guidance on technology choice, prototyping, interfaces, data, constraints, and re-evaluation.
    limitations: Government digital-service context; does not establish that every product should use the same prototyping process.
    reviewed: 2026-09-14

  - id: uk-government-ai-playbook-use-cases
    title: Artificial Intelligence Playbook for the UK Government
    publisher: UK Government
    publication_date: 2025-02-10
    url: https://www.gov.uk/government/publications/ai-playbook-for-the-uk-government/artificial-intelligence-playbook-for-the-uk-government-html
    evidence_type: official_guidance
    supports:
      - ai_use_cases_should_be_led_by_business_and_user_needs
      - multidisciplinary_teams_should_include_relevant_business_domain_and_technical_expertise
      - technology_capability_alone_is_not_a_use_case
    scope: Government guidance on AI use-case selection, multidisciplinary teams, governance, procurement, testing, and lifecycle management.
    limitations: Public-sector guidance rather than empirical evidence that a specific product process maximises commercial returns.
    reviewed: 2026-09-14

  - id: nist-ai-rmf-map-product-context
    title: NIST AI Risk Management Framework — MAP function
    publisher: National Institute of Standards and Technology
    url: https://airc.nist.gov/airmf-resources/airmf/5-sec-core/
    evidence_type: official_framework
    supports:
      - interdisciplinary_participation_should_be_prioritised
      - business_value_or_business_use_should_be_defined
      - intended_tasks_requirements_benefits_and_costs_should_be_understood
    scope: NIST AI RMF MAP categories concerning context, business value, interdisciplinary actors, requirements, intended tasks, benefits, costs, and risks.
    limitations: Risk-management framework rather than a product-discovery or market-validation methodology. It does not define willingness to pay or commercial demand.
    reviewed: 2026-09-14
