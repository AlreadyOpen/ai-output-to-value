sources:
  - id: govuk-learning-user-needs
    title: Learning about users and their needs
    publisher: GOV.UK Service Manual
    url: https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs
    evidence_type: official_guidance
    supports:
      - start_by_learning_about_users_and_their_needs
      - non_user_suggestions_should_be_treated_as_assumptions_to_test
    scope: UK Government service-design guidance on user research, user needs, discovery, and validation.
    limitations: Public-service guidance rather than empirical proof of commercial product success.
    reviewed: 2026-09-14

  - id: govuk-service-standard-understand-users
    title: Understand users and their needs
    publisher: GOV.UK Service Standard
    url: https://www.gov.uk/service-manual/service-standard/point-1-understand-user-needs
    evidence_type: official_guidance
    supports:
      - focus_on_user_problem_not_preselected_solution
      - test_assumptions_early_and_often
      - prototypes_can_test_hypotheses
    scope: Service Standard guidance on understanding users, context, and problems before committing to solutions.
    limitations: Government service standard; not a controlled study or commercial-product profitability framework.
    reviewed: 2026-09-14

  - id: govuk-service-team-roles
    title: What each role does in a service team
    publisher: GOV.UK Service Manual
    url: https://www.gov.uk/service-manual/the-team/what-each-role-does-in-service-team
    evidence_type: official_guidance
    supports:
      - multidisciplinary_teams_combine_product_research_design_delivery_and_development
    scope: UK Government guidance on multidisciplinary digital service teams and role collaboration.
    limitations: Role names and staffing patterns are government-specific and should not be copied mechanically into every organisation.
    reviewed: 2026-09-14

  - id: uk-government-ai-playbook-use-cases
    title: Artificial Intelligence Playbook for the UK Government
    publisher: UK Government
    url: https://www.gov.uk/government/publications/ai-playbook-for-the-uk-government/artificial-intelligence-playbook-for-the-uk-government-html
    evidence_type: official_guidance
    supports:
      - ai_use_cases_should_be_led_by_business_and_user_needs
      - technology_capability_alone_is_not_a_use_case
    scope: Government guidance on AI use-case selection, multidisciplinary teams, governance, testing, and lifecycle management.
    limitations: Public-sector guidance rather than empirical evidence that a specific product process maximises commercial returns.
    reviewed: 2026-09-14
