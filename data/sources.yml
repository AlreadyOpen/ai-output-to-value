    publisher: National Bureau of Economic Research
    url: https://www.nber.org/papers/w30077
    evidence_type: research_working_paper
    supports:
      - ecommerce_expansion_can_reduce_nearby_physical_store_sales
      - ecommerce_expansion_can_affect_retail_employment_store_exit_and_entry
    scope: Study around the staggered rollout of a major e-commerce firm's fulfilment centres. The authors report approximately 4% lower sales and 2.1% lower employment at proximate stores, with increased exits and reduced entry.
