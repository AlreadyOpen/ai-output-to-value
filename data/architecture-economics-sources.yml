# Sources for architecture, model-routing economics, and cross-functional AI product decisions.
#
# These sources support the general principles in
# content/architecture-economics-and-product-decisions.md.
# They do not validate any private or organisation-specific case.

sources:
  - id: routellm-2024
    title: RouteLLM — Learning to Route LLMs with Preference Data
    publisher: arXiv / research preprint
    authors:
      - Isaac Ong
      - Amjad Almahairi
      - Vincent Wu
      - Wei-Lin Chiang
      - Tianhao Wu
      - Joseph E. Gonzalez
      - M Waleed Kadous
      - Ion Stoica
    publication_date: 2024-06-26
    url: https://arxiv.org/abs/2406.18665
    evidence_type: research_preprint
    supports:
      - stronger_and_weaker_models_can_be_routed_selectively
      - model_selection_can_trade_off_cost_and_response_quality
      - routing_can_reduce_inference_cost_in_evaluated_settings
    scope: Learned routing between a stronger, more expensive LLM and a weaker, cheaper LLM using preference data and benchmark evaluation.
    limitations: Benchmark results do not establish the same savings or quality on a different customer workload, model pair, tool-using agent, or production system. The paper does not establish that a planner/executor split is universally optimal.
    reviewed: 2026-09-14

  - id: routellm-github
    title: RouteLLM — framework for serving and evaluating LLM routers
    publisher: LMSYS / GitHub
    url: https://github.com/lm-sys/RouteLLM
    evidence_type: open_source_research_implementation
    supports:
      - practical_implementation_of_cost_quality_routing
      - routing_thresholds_control_cost_quality_tradeoff
    scope: Open-source implementation associated with RouteLLM research, including routing between stronger and weaker models.
    limitations: Repository benchmark claims are workload- and configuration-specific. An implementation being available does not establish suitability for a particular production service.
    reviewed: 2026-09-14

  - id: frugalgpt-2023-2024
    title: FrugalGPT — How to Use Large Language Models While Reducing Cost and Improving Performance
    publisher: Transactions on Machine Learning Research / arXiv
    authors:
      - Lingjiao Chen
      - Matei Zaharia
      - James Zou
    url: https://arxiv.org/abs/2305.05176
    evidence_type: research_paper
    supports:
      - llm_cascades_can_trade_off_cost_and_quality
      - different_models_can_be_combined_selectively_under_budget_constraints
      - inference_cost_should_be_optimised_at_workflow_level_not_by_model_price_alone
    scope: Prompt adaptation, LLM approximation, and LLM cascades evaluated across several datasets and commercial models.
    limitations: Reported savings and accuracy changes are specific to the evaluated datasets, models, thresholds, and period. Cascades can add latency and extra calls. Results do not prove that every multi-model architecture is cheaper or better.
    reviewed: 2026-09-14

  - id: frugalgpt-github
    title: FrugalGPT — better quality and lower cost for LLM applications
    publisher: Stanford Future Data / GitHub
    url: https://github.com/stanford-futuredata/FrugalGPT
    evidence_type: open_source_research_implementation
    supports:
      - practical_llm_cascade_and_budget_constrained_evaluation
      - multiple_model_strategies_can_be_compared_empirically
    scope: Open-source implementation and evaluation material associated with FrugalGPT.
    limitations: Example configurations and historical model comparisons do not establish production economics for a different task or current model market.
    reviewed: 2026-09-14

  - id: uk-government-ai-playbook-multidisciplinary
    title: Artificial Intelligence Playbook for the UK Government
    publisher: UK Government
    publication_date: 2025-02-10
    url: https://www.gov.uk/government/publications/ai-playbook-for-the-uk-government/artificial-intelligence-playbook-for-the-uk-government-html
    evidence_type: official_guidance
    supports:
      - ai_projects_need_multidisciplinary_teams
      - ai_use_cases_should_be_led_by_business_and_user_needs
      - technical_and_domain_expertise_should_be_combined
      - commercial_colleagues_should_be_involved_from_the_start
      - live_operation_and_service_measurement_are_part_of_ai_delivery
    scope: Public-sector guidance covering AI goal definition, use-case selection, multidisciplinary teams, commercial engagement, testing, deployment, and lifecycle management.
    limitations: Government guidance rather than empirical proof of commercial success. Specific governance expectations may not transfer directly to every private-sector organisation.
    reviewed: 2026-09-14

  - id: nist-ai-rmf-core-map
    title: NIST AI Risk Management Framework — MAP function
    publisher: National Institute of Standards and Technology
    url: https://airc.nist.gov/airmf-resources/airmf/5-sec-core/
    evidence_type: official_framework
    supports:
      - deployment_context_should_be_established_and_documented
      - interdisciplinary_participation_is_prioritised
      - business_value_or_business_use_should_be_defined
      - intended_tasks_and_methods_should_be_defined
      - expected_benefits_and_costs_should_be_examined
    scope: NIST AI RMF MAP categories covering context, business value, interdisciplinary actors, intended tasks, expected benefits, and expected costs.
    limitations: Risk-management framework rather than a product-profitability model. It does not prescribe one specific organisational structure or AI architecture.
    reviewed: 2026-09-14

  - id: nist-ai-rmf-playbook-map
    title: NIST AI RMF Playbook — MAP
    publisher: National Institute of Standards and Technology
    url: https://airc.nist.gov/airmf-resources/playbook/map/
    evidence_type: official_framework_playbook
    supports:
      - ai_system_purpose_should_be_evaluated_in_business_context
      - alternatives_and_context_should_be_considered
      - business_benefit_should_be_considered_against_cost_and_risk
    scope: Suggested actions and documentation practices for applying the MAP function of the NIST AI RMF.
    limitations: Advisory playbook. It supports disciplined context and trade-off analysis but does not quantify the economics of a specific system.
    reviewed: 2026-09-14
