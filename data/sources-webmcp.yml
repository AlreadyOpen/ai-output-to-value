sources:
  - id: webmcp-spec-browser-tools
    title: WebMCP explainer and specification source
    publisher: Web Machine Learning Community Group / webmachinelearning
    url: https://github.com/webmachinelearning/webmcp
    evidence_type: emerging_web_specification
    supports:
      - websites_can_register_structured_tools_for_agents
      - document_modelcontext_registertool
      - browser_agent_tool_discovery_and_invocation
    scope: Current WebMCP specification/explainer source describing an in-browser model-context interface under document.modelContext, including tool registration, discovery, invocation, and lifecycle.
    limitations: WebMCP is still an emerging specification effort. The specification describes an interface; it does not prove that a particular implementation is secure, correct, authorised, reliable, or commercially valuable.
    reviewed: 2026-09-15

