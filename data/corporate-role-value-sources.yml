# Evidence extension for content/assess-every-layer-of-the-company.md

sources:
  - id: oecd-corporate-governance-board-responsibilities-2023
    title: G20/OECD Principles of Corporate Governance 2023 — Responsibilities of the board
    publisher: OECD
    url: https://www.oecd.org/en/publications/g20-oecd-principles-of-corporate-governance-2023_ed750b30-en/full-report/component-8.html
    evidence_type: intergovernmental_governance_standard
    supports:
      - boards_are_responsible_for_strategic_guidance_and_monitoring_management
      - boards_oversee_risk_major_decisions_and_accountability
      - board_and_management_roles_should_be_distinguished
    scope: International corporate-governance principles describing board responsibilities, independence, oversight, strategy, risk, executive monitoring, and accountability.
    limitations: Principles are intended as governance guidance across jurisdictions and do not prescribe identical legal duties everywhere. They do not establish that any particular board structure produces superior financial performance.
    reviewed: 2026-09-14

  - id: oecd-shareholder-rights-2023
    title: G20/OECD Principles of Corporate Governance 2023 — Shareholder rights and key ownership functions
    publisher: OECD
    url: https://www.oecd.org/en/publications/g20-oecd-principles-of-corporate-governance-2023_ed750b30-en/full-report/component-5.html
    evidence_type: intergovernmental_governance_standard
    supports:
      - shareholders_have_property_and_governance_rights_distinct_from_management_roles
      - shareholders_are_not_normally_responsible_for_day_to_day_corporate_management
      - boards_and_management_normally_handle_strategy_and_operations
    scope: International principles covering shareholder rights, voting, ownership, corporate control, and the distinction between ownership and management.
    limitations: Governance guidance across jurisdictions; detailed shareholder rights and responsibilities vary by company structure and local law.
    reviewed: 2026-09-14

  - id: asic-company-officeholder-duties
    title: Company officeholder duties
    publisher: Australian Securities and Investments Commission
    url: https://asic.gov.au/for-business/running-a-company/company-officeholder-duties/
    evidence_type: official_guidance
    supports:
      - directors_and_officeholders_have_statutory_duties
      - directors_must_understand_company_operations_and_financial_position
      - delegation_does_not_remove_all_director_responsibility
    scope: Australian guidance on directors' and officeholders' legal obligations.
    limitations: Australia-specific. Legal duties, delegation rules, and liability differ across jurisdictions and entity forms.
    reviewed: 2026-09-14

  - id: berkeley-dynamic-capabilities-2016
    title: The Key to Keeping Up — Dynamic Capabilities
    publisher: California Management Review / UC Berkeley Haas
    url: https://cmr.berkeley.edu/2016/08/dynamic-capabilities/
    evidence_type: management_research_summary
    supports:
      - firms_need_to_reconfigure_internal_and_external_competencies_as_conditions_change
      - capabilities_are_not_static_sources_of_advantage
      - sensing_seizing_and_transforming_are_core_to_dynamic_capability
    scope: Management research summary explaining David Teece's dynamic-capabilities framework and the need for firms to adapt competencies in changing environments.
    limitations: Conceptual management framework rather than a quantitative valuation model for individual jobs. It does not support literally pricing people or roles like financial securities.
    reviewed: 2026-09-14

  - id: berkeley-dynamic-capabilities-agility-2016
    title: Dynamic Capabilities and Organizational Agility — Risk, Uncertainty, and Strategy in the Innovation Economy
    publisher: California Management Review
    url: https://cmr.berkeley.edu/2016/08/58-4-dynamic-capabilities-and-organizational-agility-risk-uncertainty-and-strategy-in-the-innovation-economy/
    evidence_type: management_research
    supports:
      - organisational_agility_has_costs
      - firms_should_calibrate_reconfiguration_to_uncertainty_and_strategy
      - constant_transformation_is_not_automatically_optimal
    scope: Management analysis of agility, uncertainty, strategy, and dynamic capabilities.
    limitations: Strategic-management analysis, not a workforce-pricing formula or employment-policy standard.
    reviewed: 2026-09-14

  - id: imf-ai-future-of-work-2024
    title: Gen-AI — Artificial Intelligence and the Future of Work
    publisher: International Monetary Fund
    url: https://www.imf.org/en/Publications/Staff-Discussion-Notes/Issues/2024/01/14/Gen-AI-Artificial-Intelligence-and-the-Future-of-Work-542379
    evidence_type: intergovernmental_research
    supports:
      - ai_exposure_and_complementarity_differ_across_occupations
      - effects_depend_on_skills_adoption_regulation_and_technical_change
      - static_assessments_of_ai_exposure_have_limitations
    scope: Cross-country conceptual and empirical framework for AI exposure, complementarity, and labour-market effects.
    limitations: Occupational exposure is not the same as actual displacement. The IMF explicitly notes that static frameworks do not capture future integration, changing skills, infrastructure, regulation, and feedback effects.
    reviewed: 2026-09-14

  - id: oecd-skills-in-ai-age-2026
    title: Skills in the AI age
    publisher: OECD
    url: https://www.oecd.org/en/publications/skills-in-the-ai-age_972bd15e-en.html
    evidence_type: intergovernmental_research
    supports:
      - ai_can_automate_create_and_complement_tasks_simultaneously
      - occupational_exposure_does_not_equal_automation_risk
      - labour_demand_changes_depend_on_the_balance_of_multiple_effects
    scope: OECD synthesis of AI's effects on skills, tasks, employment, complementarity, and automation.
    limitations: Broad evidence synthesis across economies and occupations. It does not predict the future value of a specific employee, manager, director, or agent.
    reviewed: 2026-09-14

  - id: cloudflare-agent-identity-wallet-2026
    title: Cloudflare Gives AI Agents an Identity and a Wallet
    publisher: Cloudflare
    url: https://www.cloudflare.com/press/press-releases/2026/cloudflare-gives-ai-agents-an-identity-and-a-wallet/
    evidence_type: vendor_announcement
    supports:
      - organisations_can_delegate_operational_authority_to_agents
      - agent_permissions_and_spending_authority_can_be_programmatically_constrained
    scope: Cloudflare announcement of agent identity, Account Wallets, and delegated Virtual Wallets.
    limitations: Product announcement and forward-looking material. It does not establish legal personhood or corporate-officeholder status for agents.
    reviewed: 2026-09-14
