name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publication_mode:
        description: Site variant to deploy
        required: true
        default: preview
        type: choice
        options:
          - preview
          - release

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_mode || 'preview' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build selected publication
        env:
          PUBLICATION_REPO_URL: https://github.com/${{ github.repository }}
          PUBLICATION_UMBRELLA_URL: https://github.com/AlreadyOpen
          PUBLICATION_SOURCE_REF: ${{ github.sha }}
        run: python scripts/build_site.py

      - name: Validate generated artifact links
        run: python scripts/check_site_links.py

      - name: Enforce release approval policy
        if: ${{ env.PUBLICATION_MODE == 'release' }}
        run: python scripts/check_release.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
