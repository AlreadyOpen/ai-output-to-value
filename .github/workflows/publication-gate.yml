name: Publication gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  publication-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install check dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run publication regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate example claim gate core
        run: python scripts/claim_gate.py toolkit/claim.example.json --json

      - name: Validate reusable claim gate Action end to end
        uses: ./
        with:
          claim: toolkit/claim.example.json

      - name: Test native MCP package
        working-directory: packages/mcp
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Install web UI dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Sync pdfcn components
        working-directory: web
        run: npm run pdfcn:sync

      - name: Type-check React UI and PDF templates
        working-directory: web
        run: npm run typecheck

      - name: Build static publication preview with UI and PDF
        run: python scripts/build_with_ui.py

      - name: Validate repository evidence structure and internal links
        run: python scripts/check_publication.py

      - name: Validate preview artifact links
        run: python scripts/check_site_links.py

      - name: Build proposed release artifact with UI and PDF
        env:
          PUBLICATION_MODE: release
        run: python scripts/build_with_ui.py

      - name: Validate proposed release artifact links
        run: python scripts/check_site_links.py
