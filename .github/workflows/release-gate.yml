name: Release approval gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install check dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install web UI dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Sync pdfcn components
        working-directory: web
        run: npm run pdfcn:sync

      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate reusable claim gate Action end to end
        uses: ./
        with:
          claim: toolkit/claim.example.json

      - name: Test native MCP package
        working-directory: packages/mcp
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Type-check React UI and PDF templates
        working-directory: web
        run: npm run typecheck

      - name: Build working preview using the deployable pipeline
        run: python scripts/build_with_ui.py

      - name: Validate repository evidence structure and links
        run: python scripts/check_publication.py

      - name: Validate preview artifact interaction and links
        run: python scripts/check_site_links.py

      - name: Build reviewed release candidate using the deployable pipeline
        env:
          PUBLICATION_MODE: release
        run: python scripts/build_with_ui.py

      - name: Validate release artifact interaction and links
        run: python scripts/check_site_links.py

      - name: Enforce release approval policy and artifact scope
        run: python scripts/check_release.py
